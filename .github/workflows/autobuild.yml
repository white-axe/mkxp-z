# I have no idea what I'm doing
name: Automatic Build

on:
  push:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']
  pull_request:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']
  workflow_dispatch:

jobs:
  verify-ruby-configure-scripts:
    name: Verify Ruby 3.1 configure scripts
    runs-on: ubuntu-latest
    container:
      image: nixos/nix:2.32.8
      options: -u root --privileged
      volumes:
        - /etc/ca-certificates:/etc/ca-certificates
        - /etc/ssl:/etc/ssl
    steps:
      - name: Checkout repository
        uses: taiki-e/checkout-action@v1

      - name: Enable Nix sandboxing
        run: |
          echo 'sandbox = true' >> /etc/nix/nix.conf

      - name: Install dependencies
        run: |
          nix-channel --add https://nixos.org/channels/nixos-25.11 nixpkgs
          nix-channel --update nixpkgs
          nix-shell -p autoconf meson --run ''

      - name: Verify
        run: |
          nix-shell -p autoconf meson --run '
            meson subprojects download ruby-3.1
            cd subprojects/ruby-3.1
            old_configure_hash="$(sha256sum configure)"
            echo "old: $old_configure_hash"
            old_config_guess_hash="$(sha256sum tool/config.guess)"
            echo "old: $old_config_guess_hash"
            old_config_sub_hash="$(sha256sum tool/config.sub)"
            echo "old: $old_config_sub_hash"
            autoreconf -fi
            new_configure_hash="$(sha256sum configure)"
            echo "new: $new_configure_hash"
            new_config_guess_hash="$(sha256sum tool/config.guess)"
            echo "new: $new_config_guess_hash"
            new_config_sub_hash="$(sha256sum tool/config.sub)"
            echo "new: $new_config_sub_hash"
            error_flag=
            if [ "$old_configure_hash" != "$new_configure_hash" ]
            then
              echo "::error::configure hash does not match"
              error_flag=1
            fi
            if [ "$old_config_guess_hash" != "$new_config_guess_hash" ]
            then
              echo "::error::tool/config.guess hash does not match"
              error_flag=1
            fi
            if [ "$old_config_sub_hash" != "$new_config_sub_hash" ]
            then
              echo "::error::tool/config.sub hash does not match"
              error_flag=1
            fi
            if [ -n "$error_flag" ]
            then
              exit 1
            fi
          '

  build-windows-msys2:
    name: Windows MSYS2
    runs-on: windows-latest
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            mingw-w64-x86_64-git
            diffutils
            mingw-w64-x86_64-ruby
            bison
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ccache
            make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore from cache
        if: false
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: windows-msys2-x86_64-
          restore-keys: windows-msys2-x86_64-

      - name: Set up ccache
        shell: msys2 {0}
        run: |
          ccache --set-config=cache_dir='${{ runner.temp }}/ccache'
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=1280MiB
          ccache --zero-stats

      - name: Configure
        shell: msys2 {0}
        run: |
          meson setup --prefix "$(realpath .)/build/artifact" --buildtype release -Dstrip=true -Db_lto=true build

      - name: Build
        id: build
        shell: msys2 {0}
        run: |
          exit_code=0
          CLICOLOR_FORCE=1 ninja -C build -v || exit_code=$?
          echo exit-code=$exit_code >> "$GITHUB_OUTPUT"
          date -u +time=%Y-%m-%dT%H:%M:%SZ >> "$GITHUB_OUTPUT"

      - name: Save to cache
        if: false
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: windows-msys2-x86_64-${{ github.sha }}-${{ steps.build.outputs.time }}

      - name: Show ccache statistics
        shell: msys2 {0}
        run: |
          ccache --show-stats --verbose

      - name: Check build status
        shell: msys2 {0}
        run: |
          exit ${{ steps.build.outputs.exit-code }}

      - name: Prepare artifact
        shell: msys2 {0}
        run: |
          meson install -C build --no-rebuild --tags mkxp-z

      - name: Check for DLLs missing from the artifact
        shell: msys2 {0}
        run: |
          cd build/artifact
          error_flag=

          for file in *.exe
          do
            ldd_output="$(ldd "$file")"
            echo "$file"
            echo "$ldd_output"

            while IFS= read -r line
            do
              dll_name="$(echo "$line" | sed -e 's/=>/|/g' | cut -d '|' -f 1 | sed -e 's/^[ \t]*//g' -e 's/[ \t]*$//g')"
              dll_location="$(echo "$line" | sed -e 's/=>/|/g' | cut -d '|' -f 2 | sed -e 's/^[ \t]*//g' -e 's/[ \t]*$//g')"
              if [[ "$dll_location" = 'not found'* ]] || [[ "$dll_location" = '/mingw64/bin/'* ]] || [[ "$dll_location" = '/mingw64/lib/'* ]] || [[ "$dll_location" = '/mingw64/usr/bin/'* ]] || [[ "$dll_location" = '/mingw64/usr/lib/'* ]]
              then
                error_flag=1
                echo "::error::$dll_name is missing from the artifact"
              fi
            done <<< "$ldd_output"
          done

          if [ -n "$error_flag" ]
          then
            exit 1
          fi

  build-windows-cross:
    name: Windows ${{ matrix.arch_mkxpz }}
    runs-on: ubuntu-latest
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_mkxpz: arm64
            clang: true
            cache: true
          - arch_mkxpz: x86
            clang: true
            cache: false
          - arch_mkxpz: x86_64
            clang: false # FIXME: x86_64 binaries built with Clang cause Ruby to crash at run time
            cache: true
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - name: Install dependencies
        run: |
          apt update
          apt install -y git diffutils ruby bison gcc g++ ccache make cmake meson

          if [ '${{ matrix.clang }}' = 'true' ]
          then
            llvm_mingw_version=20260224-msvcrt-ubuntu-22.04-x86_64
            apt install -y curl
            cd ~
            curl -Lo llvm-mingw.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/$(echo $llvm_mingw_version | cut -f 1 -d -)/llvm-mingw-$llvm_mingw_version.tar.xz
            tar -xJf llvm-mingw.tar.xz
            rm llvm-mingw.tar.xz
            "~/llvm-mingw-$llvm_mingw_version/bin/clang" --version
            echo "PATH=~/llvm-mingw-$llvm_mingw_version/bin:$PATH" >> "$GITHUB_ENV"
          else
            apt install -y mingw-w64
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore from cache
        if: ${{ matrix.cache }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: windows-cross-${{ matrix.arch_mkxpz }}-
          restore-keys: windows-cross-${{ matrix.arch_mkxpz }}-

      - name: Set up ccache
        run: |
          ccache --set-config=cache_dir='${{ runner.temp }}/ccache'
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=1280MiB
          ccache --zero-stats

      - name: Configure
        run: |
          if [ '${{ matrix.clang }}' = 'true' ]
          then
            compiler=clang
          else
            compiler=gcc
          fi

          meson setup --prefix "$(realpath .)/build/artifact" --cross-file windows/meson-$compiler-${{ matrix.arch_mkxpz }}.txt --buildtype release -Dstrip=true -Db_lto=true build

      - name: Build
        id: build
        run: |
          exit_code=0
          CLICOLOR_FORCE=1 ninja -C build -v || exit_code=$?
          echo exit-code=$exit_code >> "$GITHUB_OUTPUT"
          date -u +time=%Y-%m-%dT%H:%M:%SZ >> "$GITHUB_OUTPUT"

      - name: Save to cache
        if: ${{ matrix.cache }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: windows-cross-${{ matrix.arch_mkxpz }}-${{ github.sha }}-${{ steps.build.outputs.time }}

      - name: Show ccache statistics
        run: |
          ccache --show-stats --verbose

      - name: Check build status
        run: |
          exit ${{ steps.build.outputs.exit-code }}

      - name: Prepare artifact
        run: |
          meson install -C build --no-rebuild --tags mkxp-z

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.windows.${{matrix.arch_mkxpz}}.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact

  build-linux-native:
    name: Ubuntu 22.04 x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git diffutils ruby bison gcc g++ ccache make cmake ninja-build python3-pip
          pip3 install meson

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore from cache
        if: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ubuntu-jammy-x86_64-
          restore-keys: ubuntu-jammy-x86_64-

      - name: Set up ccache
        run: |
          ccache --set-config=cache_dir='${{ runner.temp }}/ccache'
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=1280MiB
          ccache --zero-stats

      - name: Configure
        run: |
          meson setup --prefix "$(realpath .)/build/artifact" --buildtype release -Dstrip=true -Db_lto=true build

      - name: Build
        id: build
        run: |
          exit_code=0
          CLICOLOR_FORCE=1 ninja -C build -v || exit_code=$?
          echo exit-code=$exit_code >> "$GITHUB_OUTPUT"
          date -u +time=%Y-%m-%dT%H:%M:%SZ >> "$GITHUB_OUTPUT"

      - name: Save to cache
        if: true
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ubuntu-jammy-x86_64-${{ github.sha }}-${{ steps.build.outputs.time }}

      - name: Show ccache statistics
        run: |
          ccache --show-stats --verbose

      - name: Check build status
        run: |
          exit ${{ steps.build.outputs.exit-code }}

      - name: Prepare artifact
        run: |
          meson install -C build --no-rebuild --tags mkxp-z

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.linux.ubuntu.22.04.x86_64.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact

  build-linux-cross:
    name: Ubuntu 22.04 ${{matrix.arch_mkxpz}}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_mkxpz: armv6
            arch_debian: armhf
            arch_gcc: arm-linux-gnueabihf
            cache: false
          - arch_mkxpz: armv7-neon
            arch_debian: armhf
            arch_gcc: arm-linux-gnueabihf
            cache: false
          - arch_mkxpz: arm64
            arch_debian: arm64
            arch_gcc: aarch64-linux-gnu
            cache: true
          - arch_mkxpz: power8le
            arch_debian: ppc64el
            arch_gcc: powerpc64le-linux-gnu
            cache: false
          - arch_mkxpz: s390x
            arch_debian: s390x
            arch_gcc: s390x-linux-gnu
            cache: false
          - arch_mkxpz: riscv64
            arch_debian: riscv64
            arch_gcc: riscv64-linux-gnu
            cache: false
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - name: Install dependencies
        run: |
          sudo sed -i "s/deb /deb [arch=amd64] /g" /etc/apt/sources.list
          sudo dpkg --add-architecture ${{matrix.arch_debian}}
          echo "deb [arch=${{matrix.arch_debian}}] http://ports.ubuntu.com/ jammy main restricted" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=${{matrix.arch_debian}}] http://ports.ubuntu.com/ jammy-updates main restricted" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=${{matrix.arch_debian}}] http://ports.ubuntu.com/ jammy universe" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=${{matrix.arch_debian}}] http://ports.ubuntu.com/ jammy-updates universe" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=${{matrix.arch_debian}}] http://ports.ubuntu.com/ jammy multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=${{matrix.arch_debian}}] http://ports.ubuntu.com/ jammy-updates multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=${{matrix.arch_debian}}] http://ports.ubuntu.com/ jammy-backports main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt update
          sudo apt install -y git diffutils ruby bison gcc g++ ccache make cmake ninja-build python3-pip
          pip3 install meson
          sudo apt install -y gcc-${{matrix.arch_gcc}} g++-${{matrix.arch_gcc}}

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore from cache
        if: ${{ matrix.cache }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ubuntu-jammy-${{ matrix.arch_mkxpz }}-
          restore-keys: ubuntu-jammy-${{ matrix.arch_mkxpz }}-

      - name: Set up ccache
        run: |
          ccache --set-config=cache_dir='${{ runner.temp }}/ccache'
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=1280MiB
          ccache --zero-stats

      - name: Configure
        run: |
          if [ '${{ matrix.arch_mkxpz }}' = 'armv7-neon' ]
          then
            arm_neon=auto
          else
            arm_neon=disabled
          fi
          meson setup --prefix "$(realpath .)/build/artifact" --cross-file linux/meson-${{ matrix.arch_mkxpz }}.txt -Darm_neon=$arm_neon --buildtype release -Dstrip=true -Db_lto=true build

      - name: Build
        id: build
        run: |
          exit_code=0
          CLICOLOR_FORCE=1 ninja -C build -v || exit_code=$?
          echo exit-code=$exit_code >> "$GITHUB_OUTPUT"
          date -u +time=%Y-%m-%dT%H:%M:%SZ >> "$GITHUB_OUTPUT"

      - name: Save to cache
        if: ${{ matrix.cache }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ubuntu-jammy-${{ matrix.arch_mkxpz }}-${{ github.sha }}-${{ steps.build.outputs.time }}

      - name: Show ccache statistics
        run: |
          ccache --show-stats --verbose

      - name: Check build status
        run: |
          exit ${{ steps.build.outputs.exit-code }}

      - name: Prepare artifact
        run: |
          meson install -C build --no-rebuild --tags mkxp-z

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.linux.ubuntu.22.04.${{matrix.arch_mkxpz}}.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact

