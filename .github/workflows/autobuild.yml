            sysroot-url: https://pkg.freebsd.org/FreeBSD:13:amd64/latest/All/Hashed/armv7-freebsd-sysroot-a2025.11.26_1~e8be0507bf.pkg
            sysroot-hash: e8be0507bfbc422700e3086e8c62f270a4941904548b91d2c83e5821fea3a13f
            cache: false
          - arch: i386
            cpu-family: x86
            cpu: i386
            endian: little
            sysroot-url: https://pkg.freebsd.org/FreeBSD:13:amd64/latest/All/Hashed/i386-freebsd-sysroot-a2025.11.26_1~3ecb308d3e.pkg
            sysroot-hash: 3ecb308d3e6dee43ff01d256608603403ea44c96ff56ffb640f4cd1d3cadf048
            cache: false
          - arch: powerpc
            cpu-family: ppc
            cpu: powerpc
            endian: big
            sysroot-url: https://pkg.freebsd.org/FreeBSD:13:amd64/latest/All/Hashed/powerpc-freebsd-sysroot-a2025.11.26_1~dc698d9fa7.pkg
            sysroot-hash: dc698d9fa7368b37d71e542cb466c8c009365dc6732c59052a4a997bd994776f
            cache: false
          - arch: powerpcspe
            cpu-family: ppc
            cpu: powerpcspe
            endian: big
            sysroot-url: https://pkg.freebsd.org/FreeBSD:13:amd64/latest/All/Hashed/powerpcspe-freebsd-sysroot-a2025.11.26_1~52ee4f5f36.pkg
            sysroot-hash: 52ee4f5f369e5cd550d8973dad93dd8162344cda0d7ee8fbc7c7bd10b7ab3b0a
            cache: false
          - arch: powerpc64
            cpu-family: ppc64
            cpu: powerpc64
            endian: big
            sysroot-url: https://pkg.freebsd.org/FreeBSD:13:amd64/latest/All/Hashed/powerpc64-freebsd-sysroot-a2025.11.26_1~8940892710.pkg
            sysroot-hash: 8940892710f79021b4e340285cf976d8aa4a319d3c86028bfa796d0d19d4a383
            cache: false
          - arch: powerpc64le
            cpu-family: ppc64
            cpu: powerpc64le
            endian: little
            sysroot-url: https://pkg.freebsd.org/FreeBSD:13:amd64/latest/All/Hashed/powerpc64le-freebsd-sysroot-a2025.11.26_1~b90bcf67b7.pkg
            sysroot-hash: b90bcf67b79f3cd3242ee21e4287e1ee53ea5e0bd87f80aadfea0b663c6b7652
            cache: false
          - arch: riscv64
            cpu-family: riscv64
            cpu: riscv64
            endian: little
            sysroot-url: https://pkg.freebsd.org/FreeBSD:13:amd64/latest/All/Hashed/riscv64-freebsd-sysroot-a2025.11.26_1~753abe4dd5.pkg
            sysroot-hash: 753abe4dd5152870aaf1945490ba76d4ad1309b7628e3fd2bdb940068449b623
            cache: false
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - name: Install dependencies
        shell: bash
        run: |
          apt update
          apt install -y git diffutils ruby bison clang llvm lld ccache make cmake meson

          apt install -y curl tar zstd
          curl -Lo sysroot.pkg '${{ matrix.sysroot-url }}'
          [ "$(sha256sum sysroot.pkg | cut -d ' ' -f 1)" = '${{ matrix.sysroot-hash }}' ]
          tar -xf sysroot.pkg --zstd
          mv usr/local/freebsd-sysroot/${{ matrix.arch }} ~/sysroot
          version=$(printf '#include <sys/param.h>\n__FreeBSD_version\n' | clang "--sysroot=$(realpath ~/sysroot)" -E - | tail -n 1)
          version_major=$((version / 100000))
          version_minor=$(((version / 1000) % 100))
          target="${{ matrix.cpu }}-unknown-freebsd$version_major.$version_minor"
          echo "Target: $target"
          echo "target=$target" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore from cache
        if: ${{ matrix.cache }}
        uses: actions/cache/restore@v5
        with:
          path: ccache
          key: freebsd-${{ matrix.arch }}-
          restore-keys: freebsd-${{ matrix.arch }}-

      - name: Set up ccache
        run: |
          ccache --set-config=cache_dir="$(pwd)/ccache"
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=1280MiB
          ccache --zero-stats

      - name: Configure
        run: |
          echo "[binaries]" | tee -a ~/cross.ini
          echo "c = ['ccache', 'clang', '--target=$target', '--sysroot=$(realpath ~/sysroot)']" | tee -a ~/cross.ini
          echo "c_ld = 'lld'" | tee -a ~/cross.ini
          echo "cpp = ['ccache', 'clang++', '--target=$target', '--sysroot=$(realpath ~/sysroot)']" | tee -a ~/cross.ini
          echo "cpp_ld = 'lld'" | tee -a ~/cross.ini
          echo "ar = 'llvm-ar'" | tee -a ~/cross.ini
          echo "ranlib = 'llvm-ranlib'" | tee -a ~/cross.ini
          echo "strip = 'llvm-strip'" | tee -a ~/cross.ini
          echo "cmake = 'cmake'" | tee -a ~/cross.ini
          echo "[host_machine]" | tee -a ~/cross.ini
          echo "system = 'freebsd'" | tee -a ~/cross.ini
          echo "cpu_family = '${{ matrix.cpu-family }}'" | tee -a ~/cross.ini
          echo "cpu = '${{ matrix.cpu }}'" | tee -a ~/cross.ini
          echo "endian = '${{ matrix.endian }}'" | tee -a ~/cross.ini
          echo "[cmake]" | tee -a ~/cross.ini
          echo "CMAKE_EXE_LINKER_FLAGS_INIT = '-fuse-ld=lld'" | tee -a ~/cross.ini
          echo "CMAKE_MODULE_LINKER_FLAGS_INIT = '-fuse-ld=lld'" | tee -a ~/cross.ini
          echo "CMAKE_SHARED_LINKER_FLAGS_INIT = '-fuse-ld=lld'" | tee -a ~/cross.ini
          echo "CMAKE_STATIC_LINKER_FLAGS_INIT = '-fuse-ld=lld'" | tee -a ~/cross.ini
          echo '--------------------------------------------------------------------------------'
          meson setup --prefix "$(realpath .)/build/artifact" --cross-file ~/cross.ini --buildtype release -Dstrip=true -Db_lto=true build

      - name: Build
        id: build
        run: |
          exit_code=0
          CLICOLOR_FORCE=1 ninja -C build -v || exit_code=$?
          echo exit-code=$exit_code >> "$GITHUB_OUTPUT"
          date -u +time=%Y-%m-%dT%H:%M:%SZ >> "$GITHUB_OUTPUT"

      - name: Save to cache
        if: ${{ matrix.cache }}
        uses: actions/cache/save@v5
        with:
          path: ccache
          key: freebsd-${{ matrix.arch }}-${{ github.sha }}-${{ steps.build.outputs.time }}

      - name: Show ccache statistics
        run: |
          ccache --show-stats --verbose

      - name: Check build status
        run: |
          exit ${{ steps.build.outputs.exit-code }}

      - name: Prepare artifact
        run: |
          meson install -C build --no-rebuild --tags mkxp-z

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.freebsd.${{ matrix.arch }}.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact

  build-macos:
    name: macOS ${{ matrix.arch_mkxpz }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_mkxpz: arm64
            cache: true
          - arch_mkxpz: x86_64
            cache: true
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - name: Install dependencies
        run: |
          brew uninstall -f --ignore-dependencies git diffutils ruby bison ccache make cmake meson
          brew install -q git diffutils ruby bison ccache make cmake meson

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore from cache
        if: ${{ matrix.cache }}
        uses: actions/cache/restore@v5
        with:
          path: ccache
          key: macos-${{ matrix.arch_mkxpz }}-
          restore-keys: macos-${{ matrix.arch_mkxpz }}-

      - name: Set up ccache
        run: |
          ccache --set-config=cache_dir="$(pwd)/ccache"
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=1280MiB
          ccache --zero-stats

      - name: Configure
        run: |
          meson setup --prefix "$(realpath .)/build/artifact" --cross-file macos/meson-${{ matrix.arch_mkxpz }}.txt --buildtype release -Dstrip=true -Db_lto=true build

      - name: Build
        id: build
        run: |
          exit_code=0
          CLICOLOR_FORCE=1 ninja -C build -v || exit_code=$?
          echo exit-code=$exit_code >> "$GITHUB_OUTPUT"
          date -u +time=%Y-%m-%dT%H:%M:%SZ >> "$GITHUB_OUTPUT"

      - name: Save to cache
        if: ${{ matrix.cache }}
        uses: actions/cache/save@v5
        with:
          path: ccache
          key: macos-${{ matrix.arch_mkxpz }}-${{ github.sha }}-${{ steps.build.outputs.time }}

      - name: Show ccache statistics
        run: |
          ccache --show-stats --verbose

      - name: Check build status
        run: |
          exit ${{ steps.build.outputs.exit-code }}

      - name: Prepare artifacts
        run: |
          meson install -C build --no-rebuild --tags mkxp-z-bundle
          mv build/artifact build/artifact-bundle
          meson install -C build --no-rebuild --tags mkxp-z

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.macos.${{ matrix.arch_mkxpz }}.standalone.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.macos.${{ matrix.arch_mkxpz }}.app.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact-bundle

  build-macos-universal:
    name: macOS universal
    runs-on: macos-latest
    needs: build-macos
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - name: Download arm64 standalone artifact
        uses: actions/download-artifact@v4
        with:
          name: mkxp-z.macos.arm64.standalone.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: artifact-arm64

      - name: Download arm64 bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: mkxp-z.macos.arm64.app.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: artifact-bundle-arm64

      - name: Download x86_64 standalone artifact
        uses: actions/download-artifact@v4
        with:
          name: mkxp-z.macos.x86_64.standalone.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: artifact-x86_64

      - name: Download x86_64 bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: mkxp-z.macos.x86_64.app.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: artifact-bundle-x86_64

      - name: Build
        run: |
          lipo artifact-arm64/mkxp-z.aarch64 artifact-x86_64/mkxp-z.x86_64 -output mkxp-z.universal -create
          cp -p -R artifact-arm64/* artifact-x86_64/
          mv artifact-x86_64 artifact
          rm artifact/mkxp-z.aarch64
          rm artifact/mkxp-z.x86_64
          mv mkxp-z.universal artifact/
          lipo artifact-bundle-arm64/mkxp-z.aarch64.app/Contents/MacOS/bundle_mkxp-z artifact-bundle-x86_64/mkxp-z.x86_64.app/Contents/MacOS/bundle_mkxp-z -output bundle_mkxp-z -create
          mv artifact-bundle-arm64/mkxp-z.aarch64.app artifact-bundle-arm64/mkxp-z.universal.app
          mv artifact-bundle-x86_64/mkxp-z.x86_64.app artifact-bundle-x86_64/mkxp-z.universal.app
          cp -p -R artifact-bundle-arm64/* artifact-bundle-x86_64/
          mv artifact-bundle-x86_64 artifact-bundle
          mv bundle_mkxp-z artifact-bundle/mkxp-z.universal.app/Contents/MacOS/

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.macos.universal.standalone.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: artifact

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.macos.universal.app.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: artifact-bundle
