  build-macos:
    name: macOS ${{ matrix.arch_mkxpz }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_mkxpz: arm64
            cache: true
          - arch_mkxpz: x86_64
            cache: true
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - name: Install dependencies
        run: |
          brew uninstall -f --ignore-dependencies git diffutils ruby bison ccache make cmake meson
          brew install -q git diffutils ruby bison ccache make cmake meson

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore from cache
        if: ${{ matrix.cache }}
        uses: actions/cache/restore@v5
