          ccache --zero-stats

      - name: Configure
        run: |
          meson setup --prefix "$(realpath .)/build/artifact" --buildtype release -Dstrip=true -Db_lto=true build

      - name: Build
        id: build
        run: |
          exit_code=0
          CLICOLOR_FORCE=1 ninja -C build -v || exit_code=$?
          echo exit-code=$exit_code >> "$GITHUB_OUTPUT"
          date -u +time=%Y-%m-%dT%H:%M:%SZ >> "$GITHUB_OUTPUT"

      - name: Save to cache
        if: false
        uses: actions/cache/save@v5
        with:
          path: ccache
          key: debian-trixie-x86_64-${{ github.sha }}-${{ steps.build.outputs.time }}

      - name: Show ccache statistics
        run: |
          ccache --show-stats --verbose

      - name: Check build status
        run: |
          exit ${{ steps.build.outputs.exit-code }}

      - name: Prepare artifact
        run: |
          meson install -C build --no-rebuild --tags mkxp-z

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.linux.debian.trixie.x86_64.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact

  build-linux-cross-container:
    name: Debian Trixie ${{matrix.arch_mkxpz}}
    runs-on: ubuntu-latest
    container: debian:trixie
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
