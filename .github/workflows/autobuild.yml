  build-freebsd:
    name: FreeBSD ${{ matrix.version-major }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    container: debian:trixie # The base runner image's version of zstd is currently unable to extract FreeBSD's pkg files
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            cpu-family: aarch64
            cpu: aarch64
            endian: little
            sysroot-url: https://pkg.freebsd.org/FreeBSD:13:amd64/latest/All/Hashed/aarch64-freebsd-sysroot-a2025.11.26_1~68315b7f42.pkg
