          path: build/artifact

  build-macos:
    name: macOS ${{ matrix.arch_mkxpz }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_mkxpz: arm64
          - arch_mkxpz: x86_64
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew uninstall -f --ignore-dependencies libtool cmake meson automake autoconf pkg-config vim
          brew install -q libtool cmake meson automake autoconf pkg-config vim

      - name: Build
        run: |
          meson setup --cross-file macos/meson-${{ matrix.arch_mkxpz }}.txt build
          cd build
          CLICOLOR_FORCE=1 ninja -v

      - name: Prepare archive
        run: |
          mkdir build/artifact
          cd build/artifact
          cp -r ../subprojects/ruby/dist/lib/ruby/3.1.0 .
          mv ./3.1.0 ./stdlib
          find .. -type f -name 'mkxp-z.*' | xargs -I {} cp {} .
          cp ../../mkxp.json .
          cp -r ../../scripts .
          cp ../../assets/LICENSE.mkxp-z-with-https.txt .

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.macos.${{ matrix.arch_mkxpz }}.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact

  build-macos-universal:
    name: macOS universal
    runs-on: macos-latest
    needs: build-macos
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - name: Download arm64 build
        uses: actions/download-artifact@v4
        with:
          name: mkxp-z.macos.arm64.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: artifact-arm64

      - name: Download x86_64 build
        uses: actions/download-artifact@v4
        with:
          name: mkxp-z.macos.x86_64.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: artifact-x86_64

      - name: Build universal binary
        run:
          lipo artifact-arm64/mkxp-z.aarch64 artifact-x86_64/mkxp-z.x86_64 -output artifact-arm64/mkxp-z.universal -create
          rm artifact-arm64/mkxp-z.aarch64

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.macos.universal.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: artifact-arm64
