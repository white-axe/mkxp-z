  # Emscripten
  - project: 'libretro-infrastructure/ci-templates'
    file: '/emscripten-static.yml'

# Stages for building
stages:
  - build-prepare
  - build-shared
  - build-static

##############################################################################
#################################### STAGES ##################################
##############################################################################

stage1:
  image: $CI_SERVER_HOST:5050/libretro-infrastructure/libretro-build-amd64-ubuntu
  stage: build-prepare
  variables:
    MINIFORGE_PACKAGES: clang clangxx make autoconf automake libtool zip binaryen universal-ctags ruby
  script:
    - !reference [.miniforge, script]
    - if [ ! -e /usr/bin/grep ]; then ln -s /bin/grep /usr/bin/grep; fi
    - if [ ! -e /usr/bin/sed ]; then ln -s /bin/sed /usr/bin/sed; fi
    - curl -Lo ~/wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-21/wasi-sdk-21.0-linux.tar.gz
    - mkdir ~/wasi-sdk
    - tar xzf ~/wasi-sdk.tar.gz -C ~/wasi-sdk --strip-components=1
    - rm ~/wasi-sdk.tar.gz
    - cd libretro
    - CLICOLOR_FORCE=1 make -j $(nproc) WASI_SDK="$HOME/wasi-sdk" NATIVE_CC=clang NATIVE_CXX=clang++ ZLIB_PATH="$HOME/miniforge3" LIBYAML_PATH="$HOME/miniforge3" OPENSSL_PATH="$HOME/miniforge3"
  artifacts:
    paths:
      - libretro/build/libretro-stage1/
    expire_in: 1 day

