# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)

##############################################################################
################################# BOILERPLATE ################################
##############################################################################

# Core definitions
.core-defs:
  variables:
    CORENAME: mkxp-z
    MAKEFILE: Makefile.libretro
  needs:
    - job: stage1
      artifacts: true

.miniforge:
  script:
    - wget -O ~/Miniforge3.sh "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh"
    - bash ~/Miniforge3.sh -b -p ~/miniforge3
    - source ~/miniforge3/etc/profile.d/conda.sh
    - conda install -y ${MINIFORGE_PACKAGES}
    - export PATH="$HOME/miniforge3/bin:$PATH"

.deps-linux:
  extends:
    - .miniforge
  variables:
    MINIFORGE_PACKAGES: git meson cmake

.deps-macos:
  script:
    - brew install -q git meson cmake

.deps-windows:
  script:
    - pacman --noconfirm -S git meson cmake

# Inclusion templates, required for the build to work
include:
  ################################## DESKTOPS ################################
  # Windows 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-x64-mingw.yml'

  # Windows 32-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-i686-mingw.yml'

  # Windows msvc10 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-x64-msvc10-msys2.yml'

  # Windows msvc10 32-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-i686-msvc10-msys2.yml'

  # Windows msvc05 32-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-i686-msvc05-msys2.yml'

  # DJGPP
  - project: 'libretro-infrastructure/ci-templates'
    file: '/djgpp-static.yml'

  # Linux 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-x64.yml'

  # Linux 32-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-i686.yml'

  # MacOS PowerPC 32-bit
